name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: 配置 JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 校验 Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 准备 local.properties
        run: echo "REQ_TOKEN=ci-placeholder" > local.properties

      - name: 单元测试
        run: ./gradlew testAdminDebugUnitTest testVisitorDebugUnitTest

      - name: 校验 detekt baseline 未被折行
        run: |
          total=$(grep -c '</ID>' config/detekt-baseline.xml)
          paired=$(grep -c '^[[:space:]]*<ID>.*</ID>[[:space:]]*$' config/detekt-baseline.xml)
          if [ "$total" != "$paired" ]; then
            echo "config/detekt-baseline.xml 被 XML 格式化器折行了：共 $total 条，其中只有 $paired 条是单行。"
            echo "每条 <ID> 必须独占一行，否则 detekt 无法匹配，会误报成新增问题。"
            echo "修复：./gradlew detektBaseline 重新生成，且不要对该文件执行 Reformat Code。"
            exit 1
          fi

      - name: 静态检查
        run: ./gradlew detekt

      - name: Lint
        run: ./gradlew lintAdminDebug lintVisitorDebug

      - name: 构建两个 flavor 的 release
        run: ./gradlew assembleAdminRelease assembleVisitorRelease

      - name: 上传测试与 lint 报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          retention-days: 7
          if-no-files-found: ignore
