name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: 配置 JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 准备 local.properties
        # REQ_TOKEN 只影响访客版的「申请存档」，CI 不需要真 token；
        # 但构建脚本会在 assembleVisitorRelease 时校验非空，这里给个占位
        run: echo "REQ_TOKEN=ci-placeholder" > local.properties

      - name: 单元测试
        run: ./gradlew testAdminDebugUnitTest

      - name: Lint
        run: ./gradlew lintAdminDebug

      - name: 构建两个 flavor 的 release
        run: ./gradlew assembleAdminRelease assembleVisitorRelease

      - name: 上传测试与 lint 报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          retention-days: 7
          if-no-files-found: ignore
