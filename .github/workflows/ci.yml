name: CI

# 这个项目没有测试和 CI 的那段时间里，同一个修复被丢失过三次
# （账号去重），也出过好几次"改动引入回退"。下面这几步都是能自动发现那类问题的。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: 配置 JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 准备 local.properties
        # REQ_TOKEN 只影响访客版的「申请存档」，CI 不需要真 token；
        # 但构建脚本会在 assembleVisitorRelease 时校验非空，这里给个占位
        run: echo "REQ_TOKEN=ci-placeholder" > local.properties

      - name: 单元测试
        run: ./gradlew --no-daemon testAdminDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintAdminDebug

      - name: 构建两个 flavor 的 release
        # release 才会跑 R8。proguard 规则收窄过，那类问题只在 release 暴露
        run: ./gradlew --no-daemon assembleAdminRelease assembleVisitorRelease

      - name: 上传测试与 lint 报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          retention-days: 7
          if-no-files-found: ignore
